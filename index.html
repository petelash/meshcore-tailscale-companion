<!DOCTYPE html>
<html lang="hr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>MeshCore Tailscale Companion – Flasher</title>
<script type="module" src="https://unpkg.com/esp-web-tools@10.4.0/dist/web/install-button.js?module"></script>
<style>
:root{color-scheme:dark;--g:#0f6e5c;--gd:#0a4a3d;--bg:#0d1513;--card:#16211e;--line:#2b3b37;--fg:#e4eeea;--muted:#93a8a2;--acc:#5fd1b6}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--fg);
 padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
header{background:var(--g);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
header h1{font-size:1.05em;margin:0;line-height:1.25}
header small{display:block;font-weight:400;opacity:.85;font-size:.78em}
.lang{display:flex;border:1px solid rgba(255,255,255,.6);border-radius:6px;overflow:hidden;flex:none}
.lang button{background:transparent;color:#fff;border:0;padding:6px 10px;font-size:.85em;cursor:pointer}
.lang button.on{background:#fff;color:var(--gd);font-weight:700}
main{max-width:560px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
h2{color:var(--acc);font-size:1em;margin:0 0 10px}
ol{padding-left:20px;margin:0}li{margin:6px 0}
p,li{line-height:1.45}.muted{color:var(--muted);font-size:.88em}
a{color:var(--acc)}code{background:var(--bg);padding:1px 5px;border-radius:4px}
.btn{display:block;width:100%;padding:14px;border-radius:8px;font-size:1.05em;font-weight:700;cursor:pointer;font-family:inherit}
.btn.main{background:var(--g);color:#fff;border:0}
.btn.sec{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.warn{color:#f0d29a}
.card.dev{border-color:var(--acc)}
.card.pw{border-color:#6b4d12;background:#2b2210}
.pwline{font-size:1.1em;margin:0 0 10px}.pwline .big{font-size:1.25em;color:#fff;background:var(--bg);padding:2px 8px;border-radius:6px;font-family:monospace}
.devname{font-size:1.2em;font-weight:700;margin:0 0 6px;color:#fff}
p.credit{color:var(--muted);font-size:.78em;text-align:center;margin:4px 0 20px}
</style></head><body>
<header><h1>MeshCore Tailscale Companion<small data-i="sub"></small></h1>
<div class="lang"><button type="button" id="b-en" onclick="setLang('en')">EN</button><button type="button" id="b-hr" onclick="setLang('hr')">HR</button></div></header>
<main>

<div class="card dev">
<h2 data-i="d_t"></h2>
<p class="devname">Seeed Studio XIAO ESP32-S3 + Wio-SX1262</p>
<p class="muted" data-h="d_1"></p>
<p class="warn" data-h="d_2"></p>
</div>

<div class="card">
<h2 data-i="i_t"></h2>
<ol>
<li data-h="i_1"></li>
<li data-h="i_2"></li>
<li data-h="i_3"></li>
<li data-h="i_4"></li>
<li data-h="i_5"></li>
</ol>
<p style="margin-top:16px">
<esp-web-install-button manifest="manifest.json">
  <button slot="activate" class="btn main" data-i="i_btn"></button>
  <span slot="unsupported" class="warn" data-i="unsup"></span>
  <span slot="not-allowed" class="warn" data-i="https"></span>
</esp-web-install-button>
</p>
<p class="muted" data-h="i_note"></p>
</div>

<div class="card">
<h2 data-i="u_t"></h2>
<p data-h="u_1"></p>
<p class="muted" data-h="u_2"></p>
<p style="margin-top:14px">
<esp-web-install-button manifest="manifest-update.json">
  <button slot="activate" class="btn sec" data-i="u_btn"></button>
  <span slot="unsupported" class="warn" data-i="unsup"></span>
  <span slot="not-allowed" class="warn" data-i="https"></span>
</esp-web-install-button>
</p>
<p class="muted" data-h="u_3"></p>
</div>

<div class="card pw">
<h2 data-i="a_t"></h2>
<p class="pwline"><span data-i="pw_ap"></span> <b>MC-TS-XXXX</b><br><span data-i="pw_pw"></span> <b class="big">password</b></p>
<p data-h="a_1"></p>
<p class="muted" data-h="links"></p>
</div>
<p class="credit" data-i="credit"></p>
</main>
<script>
var REPO='https://github.com/petelash/meshcore-tailscale-companion';
var T={hr:{sub:"Flasher · v1.18-tsc.0.2 · XIAO ESP32-S3 + Wio-SX1262",
d_t:"Uređaj",
d_1:"Seeed Studio <b>XIAO ESP32S3 &amp; Wio-SX1262 Kit</b> (XIAO ESP32-S3 s 8 MB flasha i 8 MB PSRAM-a, s Wio-SX1262 LoRa pločicom).",
d_2:"⚠️ Samo za ovaj uređaj. Ne flashaj na druge ploče (Heltec, LilyGO T-Beam/T-Deck, RAK, obični XIAO ESP32-S3 bez Wio-SX1262, XIAO nRF52840 …): neće raditi.",
i_t:"Prva instalacija",
i_1:"Otvori ovu stranicu u <b>Chromeu ili Edgeu</b> na računalu.",
i_2:"Spoji XIAO USB kabelom (s podatkovnim linijama).",
i_3:"Klikni <b>Instaliraj</b> i odaberi port uređaja.<br><span class=\"muted\">Ako se port ne pojavi: drži <b>BOOT</b>, kratko pritisni <b>RESET</b>, pusti BOOT, pa pokušaj ponovno.</span>",
i_4:"Potvrdi brisanje uređaja i pričekaj kraj (oko 1 minute).",
i_5:"Pritisni <b>RESET</b> na uređaju.",
i_btn:"Instaliraj",
i_note:"Briše sve na uređaju. Koristi za prvu instalaciju ili prelazak s drugog firmwarea.",
u_t:"Nadogradnja (zadrži postavke)",
u_1:"Za uređaj na kojem <b>već radi</b> MeshCore Tailscale Companion. Upisuje samo novi firmware. WiFi, Tailscale (ista 100.x adresa), admin lozinka, postavke, kontakti, kanali i identitet ostaju.",
u_2:"Ako je uređaj dostupan preko mreže, nadogradnju je lakše pokrenuti u web sučelju (Firmware → Provjeri nadogradnju). Ovaj gumb je za nadogradnju preko USB-a, npr. kad uređaj nije na mreži.",
u_btn:"Nadogradi (zadrži postavke)",
u_3:"Za prvu instalaciju ili uređaj s drugim firmwareom koristi gumb <b>Instaliraj</b> iznad.",
a_t:"Nakon instalacije",pw_ap:"WiFi mreža uređaja:",pw_pw:"Lozinka:",
a_1:"Na mobitelu se spoji na WiFi <code>MC-TS-XXXX</code> (lozinka <code>password</code>) i otvori <a href=\"http://192.168.4.1/\">http://192.168.4.1/</a>. Upiši WiFi, Tailscale auth ključ, naziv čvora i novu admin lozinku.",
links:"<a href=\""+REPO+"/blob/main/docs/UPUTE.md\">Upute</a> · <a href=\"https://github.com/petelash/MeshCore-Go\">MeshCore Go</a> · <a href=\""+REPO+"\">GitHub</a>",
unsup:"Ovaj preglednik ne podržava flashanje preko USB-a. Koristi Chrome ili Edge na računalu.",
https:"Stranica mora biti otvorena preko HTTPS-a.",
credit:"© 2026 Marinko Vrbanić · MIT licenca · Neslužbeni projekt, nije povezan s MeshCore projektom ni s Tailscale Inc."},
en:{sub:"Flasher · v1.18-tsc.0.2 · XIAO ESP32-S3 + Wio-SX1262",
d_t:"Device",
d_1:"Seeed Studio <b>XIAO ESP32S3 &amp; Wio-SX1262 Kit</b> (XIAO ESP32-S3 with 8 MB flash and 8 MB PSRAM, with the Wio-SX1262 LoRa board).",
d_2:"⚠️ For this device only. Do not flash it to other boards (Heltec, LilyGO T-Beam/T-Deck, RAK, a plain XIAO ESP32-S3 without the Wio-SX1262, XIAO nRF52840 …): it will not work.",
i_t:"First installation",
i_1:"Open this page in <b>Chrome or Edge</b> on a computer.",
i_2:"Connect the XIAO with a USB cable (one with data lines).",
i_3:"Click <b>Install</b> and choose the device's port.<br><span class=\"muted\">If no port shows up: hold <b>BOOT</b>, briefly press <b>RESET</b>, release BOOT and try again.</span>",
i_4:"Confirm erasing the device and wait until it finishes (about 1 minute).",
i_5:"Press <b>RESET</b> on the device.",
i_btn:"Install",
i_note:"Erases everything on the device. Use for the first installation or when coming from another firmware.",
u_t:"Update (keep settings)",
u_1:"For a device that <b>already runs</b> MeshCore Tailscale Companion. Writes only the new firmware. WiFi, Tailscale (same 100.x address), admin password, settings, contacts, channels and identity are kept.",
u_2:"If the device is reachable over the network, it's easier to update from its web interface (Firmware → Check for update). This button is for updating over USB, e.g. when the device is offline.",
u_btn:"Update (keep settings)",
u_3:"For a first installation or a device with another firmware, use the <b>Install</b> button above.",
a_t:"After installation",pw_ap:"Device WiFi network:",pw_pw:"Password:",
a_1:"On your phone, join the WiFi <code>MC-TS-XXXX</code> (password <code>password</code>) and open <a href=\"http://192.168.4.1/\">http://192.168.4.1/</a>. Enter your WiFi, Tailscale auth key, node name and a new admin password.",
links:"<a href=\""+REPO+"/blob/main/docs/UPUTE.md\">Guide (Croatian)</a> · <a href=\"https://github.com/petelash/MeshCore-Go\">MeshCore Go</a> · <a href=\""+REPO+"\">GitHub</a>",
unsup:"This browser can't flash over USB. Use Chrome or Edge on a computer.",
https:"The page must be opened over HTTPS.",
credit:"© 2026 Marinko Vrbanić · MIT licence · Unofficial project, not affiliated with MeshCore or Tailscale Inc."}};
function setLang(l){
  document.documentElement.lang=l;
  document.getElementById('b-en').className=l=='en'?'on':'';
  document.getElementById('b-hr').className=l=='hr'?'on':'';
  var e=document.querySelectorAll('[data-i]');for(var i=0;i<e.length;i++)e[i].textContent=T[l][e[i].getAttribute('data-i')];
  e=document.querySelectorAll('[data-h]');for(i=0;i<e.length;i++)e[i].innerHTML=T[l][e[i].getAttribute('data-h')];
  try{localStorage.setItem('mcl',l)}catch(x){}
}
var s=null;try{s=localStorage.getItem('mcl')}catch(x){}
if(!s)s=((navigator.language||'en').toLowerCase().indexOf('hr')==0)?'hr':'en';
setLang(s);
</script>
</body></html>
